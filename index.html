<!DOCTYPE html>

<head>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        button { outline: none; touch-action: manipulation; transition: transform 0.1s; }
        button:active { transform: scale(0.98); }
        .correct-ans { background-color: rgba(5, 150, 105, 0.2); border-color: #10b981; color: #a7f3d0; font-weight: 600; }

<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col">

    <header class="w-full border-b border-slate-800 bg-slate-900/90 backdrop-blur sticky top-0 z-50">
        <div class="max-w-3xl mx-auto px-4 py-4 flex justify-between items-center">

            <div id="quiz-progress-text" class="text-sm font-medium text-slate-400 hidden"></div>
        </div>
    </header>

    <main class="w-full max-w-xl mx-auto px-4 py-8 flex-grow flex flex-col justify-center">

            <div class="grid gap-4">
                <button id="btn-2025" class="w-full text-left p-5 rounded-2xl border border-slate-700/60 bg-slate-800/50 hover:bg-slate-700/60 transition duration-200 flex items-center justify-between group">

                        <div class="font-bold text-lg text-slate-100 group-hover:text-indigo-400">2025 NPTEL Unique Bank</div>
                        <div class="text-sm text-slate-400 mt-1">Full 2025 unique questions</div>
                    </div>
                    <div class="text-2xl text-indigo-400">▶</div>
                </button>
                <button id="btn-2026" class="w-full text-left p-5 rounded-2xl border border-slate-700/60 bg-slate-800/50 hover:bg-slate-700/60 transition duration-200 flex items-center justify-between group">

                        <div class="font-bold text-lg text-slate-100 group-hover:text-indigo-400">2026 NPTEL Unique Bank</div>

                        <div class="font-bold text-lg text-slate-100 group-hover:text-indigo-400">Merged 7-12 Unique Bank</div>
                        <div class="text-sm text-slate-400 mt-1">Will be added in Part 3</div>
                    </div>
                    <div class="text-2xl text-indigo-400">▶</div>
                </button>
            </div>
        </div>

        <!-- Quiz Screen -->
        <div id="quiz-screen" class="hidden">
            <div class="w-full bg-slate-800 h-2 rounded-full mb-6 overflow-hidden border border-slate-700/50">
                <div id="progress-bar" class="bg-indigo-500 h-full transition-all duration-300 w-0"></div>
            </div>
            <div class="bg-slate-800/50 border border-slate-700/60 rounded-2xl p-5 sm:p-7 shadow-xl">
                <h2 id="question-text" class="text-lg sm:text-xl font-semibold mb-6 text-slate-100 leading-snug"></h2>
                <div id="options-container" class="space-y-3"></div>
                <div id="feedback-banner" class="mt-4 p-3 rounded-xl text-sm font-medium hidden"></div>
                <div class="mt-8 flex justify-between items-center">
                    <span id="score-counter" class="text-xs sm:text-sm font-medium text-slate-400">Score: 0</span>
                    <button id="action-btn" class="bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-2.5 px-6 rounded-xl transition duration-200 shadow-lg shadow-indigo-600/20 disabled:opacity-50 disabled:cursor-not-allowed" disabled>
                        Submit Answer
                    </button>
                </div>
            </div>
        </div>

        <!-- Result Screen -->
        <div id="result-screen" class="hidden bg-slate-800/50 border border-slate-700/60 rounded-2xl p-6 sm:p-8 shadow-xl text-center">
            <div class="inline-flex bg-emerald-500/10 text-emerald-400 p-3 rounded-2xl mb-4 text-3xl">🏆</div>

                <button id="retry-incorrect-btn" class="hidden w-full bg-rose-600 hover:bg-rose-500 text-white font-semibold py-3 px-6 rounded-xl transition duration-200 shadow-lg shadow-rose-600/30">

                        Back to Dashboard
                    </button>
                </div>
            </div>
        </div>

        <!-- Review Screen -->
        <div id="review-screen" class="hidden space-y-4">
            <div class="flex justify-between items-center mb-2">

            <div id="review-container" class="space-y-4 max-h-[65vh] overflow-y-auto pr-1"></div>
        </div>

    </main>

                    { q: "Which method is used to get a character at a specified position in a String?", o: ["charAt()", "getChar", "characterAt()", "getAt()"], a: "charAt()" },
                    { q: "Which keyword is used to create a subclass in Java?", o: ["implements", "inherits", "extends", "super"], a: "extends" },
                    { q: "Which block is executed whether an exception occurs or not?", o: ["try", "catch", "throw", "finally"], a: "finally" },
                    { q: "Which keyword is used to explicitly throw an exception in Java?", o: ["throws", "throw", "exception", "catch"], a: "throw" },
                    { q: "Which keyword is used to indicate that a method may throw an exception?", o: ["throw", "throws", "try", "finally"], a: "throws" },
                    { q: "Which syntax is used to declare an array variable in Java?", o: ["array", "newarray", "int[] arr", "arrayof"], a: "int[] arr" },
                    { q: "Which layout manager arranges components in five regions?", o: ["FlowLayout", "BorderLayout", "GridLayout", "BoxLayout"], a: "BorderLayout" },
                    { q: "Which method is used to register an ActionListener with a JButton?", o: ["addActionListener()", "addButtonListener()", "setAction()", "registerAction()"], a: "addActionListener()" }, 
                    // Unique Variations from Week 1-6 of the Merged Set
                    { q: "Consider the program: System.out.println(cos(2*PI)); without importing Math. What will be the output if the program is executed?", o: ["It will give compile-time error", "It will give run-time error", "1.0", "3.14"], a: "It will give compile-time error" },
                    { q: "Consider the code: class Person { int a=1; int b=1; public Person(){ System.out.print(a*b+\"Java\"+a); } } class Employee { int a=0; int b=1; public Employee(){ System.out.print(a+b+\"Java\"+a); } } What is the output of new Employee()?", o: ["1Java11Java0", "1Java10Java0", "10Java0Java", "0Java11Java0"], a: "1Java11Java0" },
                    { q: "What will be the output of the program where a subclass tries to assign a=40 to a variable inherited as 'final int a=20;'?", o: ["value of a=20", "error: cannot assign a value to final variable a", "error: unknown variable 'a' in class subDemoClass", "value of a=40"], a: "error: cannot assign a value to final variable a" },
                    { q: "Consider the program with: private static void main (String[] args). How many errors does this program contain?", o: ["None", "1", "2", "3"], a: "1" },
                    { q: "Consider the code with a protected method: protected void showMarks() { System.out.println(\"100 Marks\"); } accessed via inheritance. What is the output?", o: ["100 Marks", "No output", "Compiler error", "None of the above"], a: "100 Marks" },
                    { q: "Choose the correct syntax of a Java Package below.", o: ["package PACKAGE_NAME;", "package PACKAGE_NAME.*;", "pkg PACKAGE_NAME;", "pkg PACKAGE_NAME.*;"], a: "package PACKAGE_NAME;" },
                    { q: "Which of these access specifiers must be used for main() method?", o: ["private", "public", "protected", "default"], a: "public" },
                    { q: "What will happen when thread.start(); is called once, and the second thread.start() is commented out?", o: ["The program will execute successfully, printing 'Thread is running.' twice.", "The program will throw an error when attempting to start the thread a second time.", "The program will terminate without any output.", "The program will execute successfully, printing 'Thread is running.'"], a: "The program will execute successfully, printing 'Thread is running.'" },
                    { q: "Which of the following method returns a reference to the currently executing thread object?", o: ["public static boolean interrupted();", "public static Thread currentThread();", "public final boolean isAlive();", "public final void suspend();"], a: "public static Thread currentThread();" }

 // Paste Part 3 here later
            };
// Javascript Logic
            let currentSetData = [], incorrectQuestions = [], userAnswers = [];
            let currentQuestionIndex = 0, score = 0, isSubmitted = false;

            document.getElementById('btn-2025').addEventListener('click', () => selectSet('set2025'));
            document.getElementById('btn-2026').addEventListener('click', () => selectSet('set2026'));
            document.getElementById('btn-merged').addEventListener('click', () => selectSet('setMerged'));
            
            document.getElementById('action-btn').addEventListener('click', handleAction);
            document.getElementById('retry-incorrect-btn').addEventListener('click', retryIncorrect);
            document.getElementById('review-btn').addEventListener('click', viewAnswers);
            document.getElementById('back-home-btn').addEventListener('click', resetToHome);
            document.getElementById('back-home-review-btn').addEventListener('click', resetToHome);

            function shuffleArray(array) {
                let shuffled = array.slice();
                for (let i = shuffled.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
                }
                return shuffled;
            }

            function selectSet(setName) {
                if(setsData[setName].length === 0) {
                    alert("This set will be added when you paste Part 2/3!");
                    return;
                }
                currentSetData = [...setsData[setName]];
                startQuiz();
            }

            function startQuiz() {
                currentQuestionIndex = 0; score = 0; incorrectQuestions = []; userAnswers = [];
                document.getElementById('home-screen').classList.add('hidden');
                document.getElementById('result-screen').classList.add('hidden');
                document.getElementById('review-screen').classList.add('hidden');
                document.getElementById('quiz-screen').classList.remove('hidden');
                document.getElementById('quiz-progress-text').classList.remove('hidden');
                loadQuestion();
            }

            function retryIncorrect() {
                currentSetData = [...incorrectQuestions];
                startQuiz();
            }

            function loadQuestion() {
                isSubmitted = false;
                const actionBtn = document.getElementById('action-btn');
                const feedbackBanner = document.getElementById('feedback-banner');
                const optionsContainer = document.getElementById('options-container');

                actionBtn.disabled = true; actionBtn.textContent = "Submit Answer";
                feedbackBanner.classList.add('hidden');
                
                const q = currentSetData[currentQuestionIndex];
                document.getElementById('question-text').textContent = `${currentQuestionIndex + 1}. ${q.q}`;
                document.getElementById('score-counter').textContent = `Score: ${score}`;
                
                const pct = (currentQuestionIndex / currentSetData.length) * 100;
                document.getElementById('progress-bar').style.width = `${pct}%`;
                document.getElementById('quiz-progress-text').textContent = `Q ${currentQuestionIndex + 1}/${currentSetData.length}`;

                optionsContainer.innerHTML = '';
                shuffleArray(q.o).forEach((optText) => {
                    const btn = document.createElement('button');
                    btn.className = "w-full text-left p-4 rounded-xl border border-slate-700/70 bg-slate-800/40 hover:bg-slate-700/50 hover:border-slate-600 transition text-slate-200 text-sm sm:text-base flex justify-between option-btn";
                    btn.innerHTML = `<span>${optText}</span><span class="w-5 h-5 rounded-full border border-slate-600 flex items-center justify-center text-xs"></span>`;
                    btn.dataset.text = optText;
                    btn.addEventListener('click', () => selectAnswer(btn));
                    optionsContainer.appendChild(btn);
                });
            }

            function selectAnswer(selectedElement) {
                if (isSubmitted) return;
                document.querySelectorAll('.option-btn').forEach(btn => {
                    btn.className = "w-full text-left p-4 rounded-xl border border-slate-700/70 bg-slate-800/40 hover:bg-slate-700/50 hover:border-slate-600 transition text-slate-200 text-sm sm:text-base flex justify-between option-btn";
                    btn.classList.remove('selected');
                });
                selectedElement.className = "w-full text-left p-4 rounded-xl border border-indigo-500 bg-indigo-600/10 text-indigo-200 text-sm sm:text-base flex justify-between shadow-md option-btn selected";
                document.getElementById('action-btn').disabled = false;
            }

            function handleAction() {
                if (!isSubmitted) {
                    const selected = document.querySelector('.option-btn.selected');
                    if (!selected) return;
                    isSubmitted = true;
                    
                    const q = currentSetData[currentQuestionIndex];
                    const isCorrect = (selected.dataset.text === q.a);
                    const feedback = document.getElementById('feedback-banner');

                    userAnswers.push({ q: q.q, o: q.o, sel: selected.dataset.text, ans: q.a, isCorrect: isCorrect });

                    if (isCorrect) {
                        score++;
                        selected.classList.add('correct-ans');
                        feedback.className = "mt-4 p-3 rounded-xl text-sm font-medium bg-emerald-950/60 border border-emerald-500/50 text-emerald-300 block";
                        feedback.textContent = "Correct! Well done.";
                    } else {
                        selected.classList.add('wrong-ans');
                        incorrectQuestions.push(q);
                        document.querySelectorAll('.option-btn').forEach(btn => {
                            if (btn.dataset.text === q.a) btn.classList.add('correct-ans');
                        });
                        feedback.className = "mt-4 p-3 rounded-xl text-sm font-medium bg-rose-950/60 border border-rose-500/50 text-rose-300 block";
                        feedback.innerHTML = `<strong>Incorrect!</strong> The right answer is marked in green.`;
                    }

                    document.getElementById('score-counter').textContent = `Score: ${score}`;
                    document.querySelectorAll('.option-btn').forEach(btn => btn.disabled = true);
                    document.getElementById('action-btn').textContent = (currentQuestionIndex < currentSetData.length - 1) ? "Next Question" : "Finish Set";
                } else {
                    currentQuestionIndex++;
                    if (currentQuestionIndex < currentSetData.length) loadQuestion();
                    else showResults();
                }
            }

            function showResults() {
                document.getElementById('quiz-screen').classList.add('hidden');
                document.getElementById('quiz-progress-text').classList.add('hidden');
                document.getElementById('result-screen').classList.remove('hidden');
                
                document.getElementById('final-score').textContent = `${score} / ${currentSetData.length}`;
                document.getElementById('score-percentage').textContent = `Percentage: ${Math.round((score / currentSetData.length) * 100)}%`;
                
                document.getElementById('retry-incorrect-btn').classList.toggle('hidden', incorrectQuestions.length === 0);
            }

            function viewAnswers() {
                document.getElementById('result-screen').classList.add('hidden');
                document.getElementById('review-screen').classList.remove('hidden');
                const container = document.getElementById('review-container');
                container.innerHTML = '';

                userAnswers.forEach((item, idx) => {
                    const card = document.createElement('div');
                    card.className = `p-4 rounded-xl border ${item.isCorrect ? 'border-emerald-500/40 bg-emerald-950/10' : 'border-rose-500/40 bg-rose-950/10'}`;
                    let html = `<div class="font-semibold text-sm sm:text-base mb-2 text-slate-100">Q${idx + 1}: ${item.q}</div><div class="space-y-1 pl-2">`;
                    item.o.forEach((opt) => {
                        let style = 'text-slate-300', badge = '';
                        if (opt === item.ans) { style = 'text-emerald-400 font-medium'; badge = ' ✓ [Correct]'; }
                        else if (opt === item.sel && !item.isCorrect) { style = 'text-rose-400 line-through'; badge = ' ✗ [Yours]'; }
                        else if (opt === item.sel && item.isCorrect) { style = 'text-emerald-400 font-medium'; badge = ' ✓ [Yours]'; }
                        html += `<div class="text-xs sm:text-sm py-1 ${style}">• ${opt}${badge}</div>`;
                    });
                    card.innerHTML = html + `</div>`;
                    container.appendChild(card);
                });
            }

            function resetToHome() {
                document.getElementById('review-screen').classList.add('hidden');
                document.getElementById('result-screen').classList.add('hidden');
                document.getElementById('home-screen').classList.remove('hidden');
            }
        });
    </script>
